services:
  music:
    build:
      context: .
      args:
        MUSIC_WITH_YOUTUBE: ${MUSIC_WITH_YOUTUBE:-false}
    restart: unless-stopped
    env_file: .env
    volumes:
      - music_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: .
      args:
        MUSIC_WITH_YOUTUBE: ${MUSIC_WITH_YOUTUBE:-false}
    command: ["uvicorn", "music_bot.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8085"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - music_data:/app/data
    ports:
      - "127.0.0.1:8085:8085"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  music_data:
