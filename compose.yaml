services:
  music:
    build:
      context: .
      args:
        MUSIC_WITH_YOUTUBE: ${MUSIC_WITH_YOUTUBE:-false}
        MUSIC_WITH_FINGERPRINT: ${MUSIC_WITH_FINGERPRINT:-false}
    restart: unless-stopped
    env_file: .env
    volumes:
      - music_data:/app/data
    # Download/conversion buffers cannot fill the host's persistent disk.
    # Ephemeral tmpfs is bounded independently for each container.
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: .
      args:
        MUSIC_WITH_YOUTUBE: ${MUSIC_WITH_YOUTUBE:-false}
        MUSIC_WITH_FINGERPRINT: ${MUSIC_WITH_FINGERPRINT:-false}
    command: ["uvicorn", "music_bot.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8085"]
    restart: unless-stopped
    env_file: .env
    # Only the Telegram bot worker may sync private taste snapshots to GitHub.
    # Compose environment overrides the env_file values in this web container.
    environment:
      MUSIC_PROFILE_GITHUB_REPO: ""
      MUSIC_PROFILE_GITHUB_TOKEN: ""
    volumes:
      - music_data:/app/data
    ports:
      - "127.0.0.1:8085:8085"
    # Download/conversion buffers cannot fill the host's persistent disk.
    # Ephemeral tmpfs is bounded independently for each container.
    tmpfs:
      - /tmp:size=128m,mode=1777
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  music_data:
