name: music-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q music_bot tests
      - run: python -m pytest -q
      - name: Check Mini App JavaScript syntax
        run: node --check web/collections.js && node --check web/artists.js && node --check web/navigation.js && node tests/miniapp_navigation.cjs && node tests/miniapp_track_cards.cjs && node --check web/app.js && node --check web/decisions.js && node --check web/sources.js && node --check web/queue.js && node --check web/wrapped.js && node --check web/anime.js && node --check web/screen.js
      - name: Validate optional YouTube Docker Compose configuration
        run: cp .env.example .env && docker compose config -q
      - name: Build production image with the default lightweight profile
        run: docker build --pull -t music-ci:latest .
      - name: Smoke test installed package and read-only doctor in Docker
        run: |
          docker run --rm \
            -e BOT_TOKEN=123456:ci-placeholder \
            -e OWNER_TELEGRAM_ID=42 \
            music-ci:latest python -m music_bot.doctor --json
