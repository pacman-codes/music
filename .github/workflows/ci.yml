name: music-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q music_bot tests
      - run: python -m pytest -q
      - name: Check Mini App JavaScript syntax
        run: node --check web/app.js && node --check web/anime.js
      - name: Validate optional YouTube Docker Compose configuration
        run: cp .env.example .env && docker compose config -q
